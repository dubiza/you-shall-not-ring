name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Running on a clean checkout without local.config.json also verifies that
      # cloudflare.config.ts falls back cleanly to safe public defaults out of the box.
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run build
